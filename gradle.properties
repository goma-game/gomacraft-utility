org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 版の組は NeoForge の公式の MDK(MDK-1.21.1-ModDevGradle)に合わせる。
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
# 組み立てに使う NeoForge。gomacraft のサーバが実際に積む版に合わせる(gomabase は NeoForge の版を宣言せず、
# ATM10 のパックが決める。版を上げるときは、サーバの libraries/net/neoforged/neoforge の実物を見てから)。
neo_version=21.1.265
# 動かす側の NeoForge の下限。組み立ての版より緩くしておく(パックの版が少し戻っても、Mod の依存で起動が止まらないように)。
neo_version_range=[21.1,)
loader_version_range=[1,)

# 組み立てにだけ使う、当てる先の Mod の版(配る jar には入らない)。サーバが実際に積む版に合わせる。
# 機能が有効になる版の範囲は、各機能の requirements() が持つ。パックが版を上げたら、ここを上げて
# CI の当て先の試験(MixinTargetsTest)で当て先が残っているかを見る。
ae2_version=19.2.18
emi_version=1.1.24+1.21.1
curios_version=9.5.1+1.21.1
# AE2 の必須の依存(手元と自己検査で AE2 を動かすときだけ)
guideme_version=21.1.21
natures_compass_version=1.21.1-3.4.0-neoforge
explorers_compass_version=1.21.1-3.4.0-neoforge
mcjtylib_version=1.21-9.0.22
# Mekanism と MekaWeapons(機能 mekagun_server。MekaWeapons は CurseForge のファイルの番号)
mekanism_version=1.21.1-10.7.19.85
mekaweapons_file=8951656
# EnderDrives(機能 enderdrives_primary_cache。CurseForge のプロジェクト 1226739 のファイルの番号。パックが積む版)
enderdrives_file=8607939

mod_id=gomacraft_utility
mod_name=gomacraft utility
mod_license=MIT
# tag の v<mod_version> と一致させる(release の workflow が突き合わせる)。
mod_version=0.7.0
mod_group_id=gomacraft.utility
