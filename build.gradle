plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// 雛形は NeoForge の公式の MDK(MDK-1.21.1-ModDevGradle、MIT)から、要るものだけを残した。

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 起動の自己検査(selftest)だけが使うコード。配る jar には入れない(sourceSets.main だけが jar になる)。
// 中身: わざと壊した機能を 1 つ足して gametest のサーバを起動し、壊れた機能だけが止まって起動は続くことを確かめる。
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.selftest)
    // JUnit の試験は Minecraft を起動しないが、型(イベントの bus など)は要る
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // 起動の自己検査。gametest のサーバを起動し、登録した gametest を全部回して終わる(落ちた数が終了コード)。
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.selftest
            gameDirectory = project.file('run-selftest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'gomacraft_utility.selftest', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

// 当てる先の Mod(組み立てにだけ使う。配る jar には入れず、動かす側に在るときだけ機能が有効になる)
repositories {
    // AE2 は Maven Central(org.appliedenergistics)
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.terraformersmc.com/' } }
        filter { includeGroup 'dev.emi' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.theillusivec4.top/' } }
        filter { includeGroup 'top.theillusivec4.curios' }
    }
    // 段 1(検索まわり): コンパスと mcjtylib は公式の maven にその版が無いので Modrinth の maven から取る
    // (sha1 は Modrinth の API とパックの jar で同じことを確かめた)
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

// 手元と自己検査で動かすときだけ積む Mod(配る jar と、その依存の宣言には入らない)
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
    selftestRuntimeClasspath.extendsFrom localRuntime
}

// 段 3(動作まわり): Mekanism は公式の maven、MekaWeapons は CurseForge のファイルを maven の形で引く
// (gomabase の配布も同じ取得元 cursemaven を使う)
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://modmaven.dev/' } }
        filter { includeGroup 'mekanism' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    // 段 2(EMI と AE2): 版は gradle.properties
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    // Curios の枠のワイヤレスの端末を拾う(Curios が在るときだけ呼ぶ)
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    selftestCompileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    localRuntime "org.appliedenergistics:guideme:${guideme_version}"
    localRuntime "dev.emi:emi-neoforge:${emi_version}"
    // 自己検査で Curios の枠を読む道(CuriosStacks)も通す
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    // 段 1(検索まわり): 版は gradle.properties
    compileOnly "maven.modrinth:natures-compass:${natures_compass_version}"
    compileOnly "maven.modrinth:explorers-compass:${explorers_compass_version}"
    compileOnly "maven.modrinth:mcjtylib:${mcjtylib_version}"
    // 当て先の試験(MixinTargetsTest)が、当て先のクラスとメソッドが組み立ての版に在ることを ASM で読む
    testRuntimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // ae2_repo_sort_cache: 並べ方の試験が AE2 の品の型(AEKey)と並べ方(KeySorters)を使う
    testCompileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    testRuntimeOnly "dev.emi:emi-neoforge:${emi_version}"
    testRuntimeOnly "maven.modrinth:natures-compass:${natures_compass_version}"
    testRuntimeOnly "maven.modrinth:explorers-compass:${explorers_compass_version}"
    testRuntimeOnly "maven.modrinth:mcjtylib:${mcjtylib_version}"
    // 段 3(動作まわり)mekagun_server: 型(SoundEventRegistryObject・IEnergyContainer)だけを使う。
    // MekaWeapons は CurseForge のプロジェクト 929829。自己検査で専用サーバの例外を再現・確かめる
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    selftestCompileOnly "mekanism:Mekanism:${mekanism_version}"
    localRuntime "mekanism:Mekanism:${mekanism_version}"
    localRuntime "curse.maven:mekanism-weapons-929829:${mekaweapons_file}"
    testRuntimeOnly "mekanism:Mekanism:${mekanism_version}"
    testRuntimeOnly "curse.maven:mekanism-weapons-929829:${mekaweapons_file}"

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
