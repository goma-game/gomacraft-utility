plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

// 雛形は NeoForge の公式の MDK(MDK-1.21.1-ModDevGradle、MIT)から、要るものだけを残した。

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 起動の自己検査(selftest)だけが使うコード。配る jar には入れない(sourceSets.main だけが jar になる)。
// 中身: わざと壊した機能を 1 つ足して gametest のサーバを起動し、壊れた機能だけが止まって起動は続くことを確かめる。
sourceSets {
    selftest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.selftest)
    // JUnit の試験は Minecraft を起動しないが、型(イベントの bus など)は要る
    addModdingDependenciesTo(sourceSets.test)

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // 起動の自己検査。gametest のサーバを起動し、登録した gametest を全部回して終わる(落ちた数が終了コード)。
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.selftest
            gameDirectory = project.file('run-selftest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'gomacraft_utility.selftest', 'true'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.selftest)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
