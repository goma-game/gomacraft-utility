org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 組み立てに使う版。gomacraft の fabric のサーバ(fabric_sv・fabric_cr)が実際に積む版に合わせる
# (Minecraft の版の正は gomabase の宣言の VERSION、Loader と Fabric API の版はサーバの実物。上げるときは、
# サーバの fabric-server-mc.<版>-loader.<版>-*.jar と mods/fabric-api-*.jar を見てから)。
minecraft_version=26.2
loader_version=0.20.1
loom_version=1.19.6
fabric_api_version=0.161.0+26.2
# 設定の画面を Mod Menu の一覧から開く(組み立てにだけ使う。無くても起動する)。クライアントの配布が積む版
modmenu_version=20.0.3

# 動かす側の下限(fabric.mod.json の depends)。組み立ての版より緩くしておく
minecraft_version_range=~26.2
loader_version_range=>=0.20

mod_id=gomacraft_utility
# tag の fabric-v<mod_version> と一致させる(release の workflow が突き合わせる)。forge 版の版とは別に数える
mod_version=0.1.0
