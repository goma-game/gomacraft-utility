name: build

# PR と main で、組み立て・試験(JUnit)・起動の自己検査(gametest のサーバ)を回す。
# public のリポジトリなので GitHub-hosted の runner で回す。
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      # wrapper の jar の検証(validate-wrappers)は既定で効く
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
      - name: 組み立てと試験
        run: ./gradlew --no-daemon build
      - name: 配る jar を確かめる
        run: sh .github/scripts/check-build.sh jar
      - name: 起動の自己検査(gametest のサーバ)
        run: ./gradlew --no-daemon runGameTestServer
      - name: 自己検査のログを確かめる
        run: sh .github/scripts/check-build.sh selftest run-selftest/logs/latest.log
      - name: ログを残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: selftest-logs
          path: run-selftest/logs/
          if-no-files-found: warn
          retention-days: 7
